<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>링크의 모험</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #6fa8d8;
    font-family: "Rubik", "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  canvas#game { display: block; touch-action: none; }

  #ui {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 10;
    font-family: "Rubik", sans-serif;
  }

  /* ---------- Hearts ---------- */
  #hearts {
    position: absolute;
    top: max(14px, env(safe-area-inset-top, 0px));
    left: 14px;
    display: flex;
    gap: 4px;
    padding: 8px 12px;
    background: linear-gradient(180deg, rgba(20,16,10,.68), rgba(20,16,10,.42));
    border: 1px solid rgba(255,220,150,.35);
    border-radius: 10px;
    backdrop-filter: blur(2px);
  }
  .heart { position: relative; width: 22px; height: 20px; }
  .heart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .heart .bg path { fill: #2a2118; stroke: #55483a; stroke-width: 1; }
  .heart .fg path { fill: #ff4d5e; stroke: #ffb3ba; stroke-width: .6; }
  .heart .fg { transition: clip-path .15s ease; }

  /* ---------- Top-right: minimap + stats ---------- */
  #topRight {
    position: absolute;
    top: max(14px, env(safe-area-inset-top, 0px));
    right: 14px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  #minimapWrap {
    width: 108px; height: 108px;
    border-radius: 50%;
    border: 2px solid rgba(255,220,150,.55);
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    overflow: hidden;
    background: #16210f;
  }
  #minimap { width: 100%; height: 100%; display: block; }
  #stats {
    background: linear-gradient(180deg, rgba(20,16,10,.68), rgba(20,16,10,.42));
    border: 1px solid rgba(255,220,150,.35);
    border-radius: 10px;
    padding: 7px 12px;
    color: #f4e9d8;
    font-size: 12.5px;
    text-align: right;
    line-height: 1.55;
    letter-spacing: .02em;
  }
  #stats b { color: #ffd77a; }

  /* ---------- Stamina wheel ---------- */
  #staminaWrap {
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom, 0px) + 18px);
    right: 18px;
    width: 66px; height: 66px;
  }
  body.touch #staminaWrap { right: 110px; bottom: max(96px, env(safe-area-inset-bottom, 0px) + 96px); }
  #staminaWrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  #staminaWrap circle.track { fill: none; stroke: rgba(0,0,0,.45); stroke-width: 6; }
  #staminaWrap circle.fill { fill: none; stroke: #7CFC00; stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 0 4px #7CFC00aa); transition: stroke-dashoffset .1s linear; }
  #staminaIcon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; }

  /* ---------- Menu ---------- */
  #menu {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(80,60,20,.35), transparent 60%),
      linear-gradient(180deg, #0c1220 0%, #1a1408 100%);
    display: flex; align-items: center; justify-content: center;
    color: #f4e9d8; z-index: 20; padding: 20px;
  }
  #menu.hidden { display: none; }
  .card {
    text-align: center;
    background: linear-gradient(180deg, rgba(35,28,18,.94), rgba(20,16,10,.96));
    border: 1px solid rgba(255,215,122,.4);
    padding: 36px 40px;
    border-radius: 14px;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .card h1 { font-size: 30px; margin-bottom: 6px; color: #ffd77a; letter-spacing: .02em; }
  .card .sub { margin-bottom: 18px; color: #b8a888; font-size: 13px; }
  .tips { text-align: left; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); padding: 13px 15px; border-radius: 8px; margin-bottom: 20px; font-size: 12px; line-height: 1.7; color: #d8cdb8; }
  .tips b { color: #ffd77a; }
  button.startBtn {
    background: linear-gradient(180deg, #e6543f, #c23a28);
    color: #fff; border: none; border-top: 1px solid rgba(255,255,255,.35);
    padding: 13px 34px; font-size: 15px; border-radius: 8px; cursor: pointer;
    font-weight: 700; letter-spacing: .03em;
    box-shadow: 0 6px 16px rgba(194,58,40,.4);
  }
  button.startBtn:hover { filter: brightness(1.08); }

  /* ---------- Touch controls ---------- */
  #touchUI { display: none; }
  body.touch #touchUI { display: block; }

  #joyBase {
    position: fixed;
    left: max(20px, env(safe-area-inset-left, 0px) + 20px);
    bottom: max(24px, env(safe-area-inset-bottom, 0px) + 24px);
    width: 104px; height: 104px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.3);
    z-index: 5;
  }
  #joyStick {
    position: absolute; left: 50%; top: 50%;
    width: 48px; height: 48px; margin: -24px 0 0 -24px;
    border-radius: 50%;
    background: rgba(255,215,122,.35);
    border: 2px solid rgba(255,215,122,.7);
  }
  .btn {
    position: fixed;
    width: 68px; height: 68px;
    border-radius: 50%;
    background: rgba(230,84,63,.32);
    border: 2px solid rgba(230,84,63,.75);
    color: #fff; font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    z-index: 5; cursor: pointer;
  }
  #fireBtn { right: max(20px, env(safe-area-inset-right, 0px) + 20px); bottom: max(24px, env(safe-area-inset-bottom, 0px) + 24px); }
  #jumpBtn { right: max(20px, env(safe-area-inset-right, 0px) + 20px); bottom: max(104px, env(safe-area-inset-bottom, 0px) + 104px); background: rgba(122,180,255,.28); border-color: rgba(122,180,255,.7); }

  #endCard { display: none; }
</style>
</head>
<body>


<canvas id="game"></canvas>

<div id="ui">
  <div id="hearts"></div>
  <div id="topRight">
    <div id="minimapWrap"><canvas id="minimap" width="108" height="108"></canvas></div>
    <div id="stats">
      점수 <b id="score">0</b><br>
      웨이브 <b id="wave">1</b> · 킬 <b id="kills">0</b>
    </div>
  </div>
  <div id="staminaWrap">
    <svg viewBox="0 0 66 66">
      <circle class="track" cx="33" cy="33" r="27"></circle>
      <circle class="fill" id="staminaRing" cx="33" cy="33" r="27" stroke-dasharray="169.6" stroke-dashoffset="0"></circle>
    </svg>
    <div id="staminaIcon">⚔️</div>
  </div>
</div>

<div id="menu">
  <div class="card" id="menuCard">
    <h1>링크의 모험</h1>
    <div class="sub">잊혀진 사당 · 검술 전투</div>
    <div class="tips">
      <b>PC</b> · WASD 이동 · 마우스 드래그 카메라 · 클릭 공격<br>
      <b>모바일</b> · 조이스틱 이동 · 화면 드래그 카메라 · 버튼 공격/점프
    </div>
    <button class="startBtn" onclick="startGame()">모험 시작</button>
  </div>
</div>

<div id="touchUI">
  <div id="joyBase"><div id="joyStick"></div></div>
  <div id="fireBtn" class="btn">⚔️</div>
  <div id="jumpBtn" class="btn">⤒</div>
</div>

<script src="./vendor/three.min.js"></script>
<script>
const THREE = window.THREE;

const canvas = document.getElementById("game");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
if ("outputColorSpace" in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

// ---------- Sky gradient ----------
function makeSkyTexture() {
  const c = document.createElement("canvas");
  c.width = 2; c.height = 512;
  const ctx = c.getContext("2d");
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, "#3f7fd4");
  g.addColorStop(0.45, "#7fb8e8");
  g.addColorStop(0.75, "#bcdff0");
  g.addColorStop(1, "#f3ecc8");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 2, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.background = makeSkyTexture();
scene.fog = new THREE.FogExp2(0xbcdff0, 0.0068);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 800);
scene.add(camera);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Ground (flat playable area + noisy hills beyond) ----------
const PLAY_R = 55;
const groundGeo = new THREE.PlaneGeometry(340, 340, 70, 70);
{
  const pos = groundGeo.attributes.position;
  const colors = [];
  const base = new THREE.Color(0x4c8a3a);
  const hi = new THREE.Color(0x74a84a);
  const lo = new THREE.Color(0x2f5a26);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const dist = Math.hypot(x, y);
    let h = 0;
    if (dist > PLAY_R) {
      const t = Math.min(1, (dist - PLAY_R) / 90);
      h = t * (Math.sin(x * 0.045) * 3.2 + Math.cos(y * 0.05) * 3.2 + t * 10);
    }
    pos.setZ(i, h);
    const tone = base.clone().lerp(hi, THREE.MathUtils.clamp(h / 14, 0, 1)).lerp(lo, dist < PLAY_R ? 0.12 : 0);
    colors.push(tone.r, tone.g, tone.b);
  }
  groundGeo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(
  groundGeo,
  new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Distant mountains ----------
const mountainMat = new THREE.MeshStandardMaterial({ color: 0x8593b8, roughness: 1, flatShading: true });
const mountainMat2 = new THREE.MeshStandardMaterial({ color: 0x9aa8c8, roughness: 1, flatShading: true });
for (let i = 0; i < 26; i++) {
  const a = (i / 26) * Math.PI * 2 + Math.random() * 0.12;
  const r = 150 + Math.random() * 55;
  const h = 46 + Math.random() * 70;
  const rad = 26 + Math.random() * 30;
  const cone = new THREE.Mesh(new THREE.ConeGeometry(rad, h, 5), i % 2 ? mountainMat : mountainMat2);
  cone.position.set(Math.cos(a) * r, h / 2 - 6, Math.sin(a) * r);
  cone.rotation.y = Math.random() * Math.PI;
  scene.add(cone);
}

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xbcdff0, 0x3f6b2e, 1.15));
scene.add(new THREE.AmbientLight(0xfff2d8, 0.35));
const sun = new THREE.DirectionalLight(0xfff2d0, 2.4);
sun.position.set(40, 60, 24);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -65; sun.shadow.camera.right = 65;
sun.shadow.camera.top = 65; sun.shadow.camera.bottom = -65;
sun.shadow.camera.far = 200;
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(sun.target);

const colliders = [];
function addCollider(x, z, hx, hz) { colliders.push({ cx: x, cz: z, hx, hz }); }

function addBox(x, z, w, d, h, color, opts) {
  opts = opts || {};
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: opts.roughness ?? 0.8, metalness: opts.metalness ?? 0, emissive: opts.emissive ?? 0x000000, emissiveIntensity: opts.emissiveIntensity ?? 0 })
  );
  mesh.position.set(x, (opts.baseY ?? 0) + h / 2, z);
  if (opts.rotY) mesh.rotation.y = opts.rotY;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  if (!opts.noCollide) addCollider(x, z, w / 2, d / 2);
  return mesh;
}

// ---------- Pine / broadleaf trees ----------
function pineTree(x, z, scale) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * scale, 0.24 * scale, 1.4 * scale, 6), new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 1 }));
  trunk.position.y = 0.7 * scale;
  trunk.castShadow = true;
  g.add(trunk);
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x2c5c2a, roughness: 1, flatShading: true });
  for (let i = 0; i < 3; i++) {
    const cone = new THREE.Mesh(new THREE.ConeGeometry((1.4 - i * 0.3) * scale, 1.6 * scale, 7), leafMat);
    cone.position.y = (1.5 + i * 1.05) * scale;
    cone.castShadow = true;
    g.add(cone);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  addCollider(x, z, 0.35 * scale, 0.35 * scale);
}

function broadleafTree(x, z, scale) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35 * scale, 0.5 * scale, 2.2 * scale, 7), new THREE.MeshStandardMaterial({ color: 0x5a4028, roughness: 1 }));
  trunk.position.y = 1.1 * scale;
  trunk.castShadow = true;
  g.add(trunk);
  const canopyMat = new THREE.MeshStandardMaterial({ color: 0x4a8a3a, roughness: 0.9, flatShading: true });
  for (let i = 0; i < 4; i++) {
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry((1.4 + Math.random() * 0.5) * scale, 0), canopyMat);
    s.position.set((Math.random() - 0.5) * 1.4 * scale, (2.6 + Math.random() * 0.6) * scale, (Math.random() - 0.5) * 1.4 * scale);
    s.castShadow = true;
    g.add(s);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  addCollider(x, z, 0.5 * scale, 0.5 * scale);
}

const rand = (a, b) => a + Math.random() * (b - a);
for (let i = 0; i < 34; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = rand(20, PLAY_R - 4);
  if (r < 10) continue;
  pineTree(Math.cos(a) * r, Math.sin(a) * r, rand(0.8, 1.3));
}
broadleafTree(-14, 16, 1.6);
broadleafTree(16, -18, 1.4);

// ---------- Rock / wood obstacles ----------
addBox(-10, -10, 4, 4, 2.2, 0x9a9280, { roughness: 1 });
addBox(10, -10, 4, 4, 2.2, 0xa89c86, { roughness: 1 });
addBox(-15, 10, 5, 3, 2, 0x9a9280, { roughness: 1 });
addBox(15, 10, 5, 3, 2, 0xa89c86, { roughness: 1 });

// ---------- Shrine landmark ----------
function buildShrine(x, z) {
  const g = new THREE.Group();
  const stoneMat = new THREE.MeshStandardMaterial({ color: 0x8d8878, roughness: 1, flatShading: true });
  const body = new THREE.Mesh(new THREE.ConeGeometry(6.5, 9, 4), stoneMat);
  body.position.y = 4.5;
  body.rotation.y = Math.PI / 4;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  // glowing entrance
  const doorMat = new THREE.MeshStandardMaterial({ color: 0x120c05, roughness: 0.6 });
  const door = new THREE.Mesh(new THREE.BoxGeometry(2.4, 3.4, 1.2), doorMat);
  door.position.set(0, 1.7, 4.3);
  g.add(door);

  // gold vine glow ring around door (procedural texture)
  const glowCanvas = document.createElement("canvas");
  glowCanvas.width = 256; glowCanvas.height = 256;
  const gctx = glowCanvas.getContext("2d");
  gctx.fillStyle = "#000"; gctx.fillRect(0, 0, 256, 256);
  gctx.strokeStyle = "#ffcc55";
  gctx.lineWidth = 6;
  gctx.shadowColor = "#ffcc55";
  gctx.shadowBlur = 14;
  gctx.beginPath();
  for (let a = 0; a < Math.PI * 2; a += 0.25) {
    const r1 = 70 + Math.sin(a * 3) * 18;
    const px = 128 + Math.cos(a) * r1, py = 128 + Math.sin(a) * r1;
    if (a === 0) gctx.moveTo(px, py); else gctx.lineTo(px, py);
  }
  gctx.closePath(); gctx.stroke();
  const glowTex = new THREE.CanvasTexture(glowCanvas);
  const glowMat = new THREE.MeshStandardMaterial({ map: glowTex, emissive: 0xffcc55, emissiveMap: glowTex, emissiveIntensity: 1.6, transparent: true, opacity: 0.95 });
  const glowPlane = new THREE.Mesh(new THREE.PlaneGeometry(5.5, 5.5), glowMat);
  glowPlane.position.set(0, 2.6, 3.75);
  g.add(glowPlane);

  const torch1 = new THREE.PointLight(0xffb84d, 2.2, 10);
  torch1.position.set(-2.6, 2.2, 4.2);
  g.add(torch1);
  const torch2 = torch1.clone();
  torch2.position.set(2.6, 2.2, 4.2);
  g.add(torch2);

  g.position.set(x, 0, z);
  scene.add(g);
  addCollider(x, z, 6, 6);
}
buildShrine(0, -30);

// ---------- Wooden spawn platform ----------
function buildPlatform(x, z) {
  const g = new THREE.Group();
  const plankMat = new THREE.MeshStandardMaterial({ color: 0x8a6239, roughness: 0.95 });
  const deck = new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 0.4, 20), plankMat);
  deck.position.y = 0.2;
  deck.receiveShadow = true;
  g.add(deck);
  const railMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 1 });
  const postCount = 14;
  for (let i = 0; i < postCount; i++) {
    const a = (i / postCount) * Math.PI * 2;
    if (a > Math.PI * 0.35 && a < Math.PI * 0.65) continue; // gap for entrance
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1.1, 6), railMat);
    post.position.set(Math.cos(a) * 7.6, 0.75, Math.sin(a) * 7.6);
    post.castShadow = true;
    g.add(post);
  }
  g.position.set(x, 0, z);
  scene.add(g);
}
buildPlatform(0, 22);

// ---------- Player (stylized Link) ----------
const playerGroup = new THREE.Group();
scene.add(playerGroup);

const skinMat = new THREE.MeshStandardMaterial({ color: 0xf0a876, roughness: 0.7 });
const tunicMat = new THREE.MeshStandardMaterial({ color: 0x2f6b30, roughness: 0.8 });
const sleeveMat = new THREE.MeshStandardMaterial({ color: 0xf4f0e0, roughness: 0.8 });
const beltMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.7 });
const bootMat = new THREE.MeshStandardMaterial({ color: 0x5a3d24, roughness: 0.8 });
const hairMat = new THREE.MeshStandardMaterial({ color: 0xffd966, roughness: 0.6 });
const capMat = new THREE.MeshStandardMaterial({ color: 0x2f6b30, roughness: 0.8 });

function limb(w, h, d, mat, pivotY) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.y = -h / 2;
  m.castShadow = true;
  g.add(m);
  g.position.y = pivotY;
  return g;
}

// hips + legs
const hipY = 0.62;
const legL = limb(0.13, 0.62, 0.15, bootMat, hipY);
legL.position.x = -0.11;
playerGroup.add(legL);
const legR = limb(0.13, 0.62, 0.15, bootMat, hipY);
legR.position.x = 0.11;
playerGroup.add(legR);

// torso (tunic, tapered via two stacked boxes)
const hips = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.16, 0.24), beltMat);
hips.position.y = hipY + 0.02;
hips.castShadow = true;
playerGroup.add(hips);

const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.5, 0.26), tunicMat);
torso.position.y = hipY + 0.34;
torso.castShadow = true;
playerGroup.add(torso);

const chestStrap = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.08, 0.28), beltMat);
chestStrap.position.y = hipY + 0.5;
chestStrap.castShadow = true;
playerGroup.add(chestStrap);

// arms
const shoulderY = hipY + 0.56;
const armL = limb(0.13, 0.42, 0.15, sleeveMat, shoulderY);
armL.position.x = -0.28;
playerGroup.add(armL);
const armR = limb(0.13, 0.42, 0.15, sleeveMat, shoulderY);
armR.position.x = 0.28;
playerGroup.add(armR);

// head + hair + iconic pointed cap
const headY = hipY + 0.86;
const head = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.34, 0.32), skinMat);
head.position.y = headY;
head.castShadow = true;
playerGroup.add(head);

const hair = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.1, 0.34), hairMat);
hair.position.set(0, headY + 0.02, 0.02);
playerGroup.add(hair);
const fringe = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.1, 0.06), hairMat);
fringe.position.set(0, headY - 0.02, 0.17);
playerGroup.add(fringe);

const cap = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.5, 8), capMat);
cap.position.set(0, headY + 0.34, -0.05);
cap.rotation.z = 0.18;
cap.castShadow = true;
playerGroup.add(cap);

// shield strapped to back
const shieldGroup = new THREE.Group();
const shieldFace = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.06, 12), new THREE.MeshStandardMaterial({ color: 0x3b6fb5, metalness: 0.3, roughness: 0.5 }));
shieldFace.rotation.x = Math.PI / 2;
shieldFace.castShadow = true;
shieldGroup.add(shieldFace);
const shieldRim = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.03, 6, 12), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.6, roughness: 0.4 }));
shieldRim.rotation.x = Math.PI / 2;
shieldGroup.add(shieldRim);
shieldGroup.position.set(0, hipY + 0.42, -0.2);
shieldGroup.rotation.y = 0.15;
playerGroup.add(shieldGroup);

// sword held at hip, swings forward on attack
const sword = new THREE.Group();
const blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 0.02), new THREE.MeshStandardMaterial({ color: 0xd8d8e0, metalness: 0.9, roughness: 0.25 }));
blade.position.y = 0.34;
blade.castShadow = true;
sword.add(blade);
const guard = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.04, 0.04), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.7 }));
guard.position.y = 0.02;
sword.add(guard);
const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.16, 0.06), new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 0.8 }));
hilt.position.y = -0.08;
sword.add(hilt);
sword.position.set(0.3, hipY + 0.3, -0.1);
sword.rotation.z = -0.3;
playerGroup.add(sword);
const swordRestRot = { x: sword.rotation.x, z: sword.rotation.z };

const player = {
  pos: new THREE.Vector3(0, 0, 22),
  vel: new THREE.Vector3(),
  yaw: Math.PI, pitch: 0,
  vy: 0, onGround: true,
  health: 100, maxHealth: 100,
  power: 100, maxPower: 100,
  lastFire: 0, lastDamage: -99,
};
let walkT = 0, attackAnimT = 0;

const enemies = [];
let score = 0, kills = 0, waveNum = 1;
let gameRunning = false;

function makeHealthBar() {
  const group = new THREE.Group();
  const fg = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0xff4d5e }));
  fg.scale.set(0.9, 0.09, 1);
  group.add(fg);
  group.userData.fg = fg;
  return group;
}

function spawnEnemy(type) {
  const color = type === "shooter" ? 0x1e40af : 0xdc2626;
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.25), new THREE.MeshStandardMaterial({ color }));
  body.position.y = 0.8; body.castShadow = true;
  group.add(body);
  const h = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshStandardMaterial({ color }));
  h.position.y = 1.4; h.castShadow = true;
  group.add(h);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffe066, emissive: 0xffaa00, emissiveIntensity: 0.6 });
  const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.04), eyeMat);
  eyeL.position.set(-0.08, 1.42, 0.16);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.08;
  group.add(eyeL, eyeR);
  scene.add(group);

  const bar = makeHealthBar();
  scene.add(bar);

  const enemy = {
    group, bar, type,
    hp: type === "shooter" ? 45 : 70,
    maxHp: type === "shooter" ? 45 : 70,
    speed: type === "shooter" ? 2.6 : 3.4,
    attackRange: type === "shooter" ? 13 : 1.7,
    lastAttack: -99,
    damage: type === "shooter" ? 8 : 14,
    alive: true,
  };
  enemies.push(enemy);
  return enemy;
}

function killEnemy(e) {
  e.alive = false;
  const idx = enemies.indexOf(e);
  if (idx >= 0) enemies.splice(idx, 1);
  scene.remove(e.group);
  scene.remove(e.bar);
}

const keys = {};
window.addEventListener("keydown", (e) => { keys[e.code] = true; });
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let mouseDown = false;
canvas.addEventListener("mousedown", () => { mouseDown = true; });
canvas.addEventListener("mouseup", () => { mouseDown = false; });

document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== canvas) return;
  player.yaw -= e.movementX * 0.0022;
  player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - e.movementY * 0.0022));
});

const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
let touchMoveX = 0, touchMoveZ = 0;

if (isTouch) {
  document.body.classList.add("touch");
  const joyBase = document.getElementById("joyBase");
  const joyStick = document.getElementById("joyStick");
  const fireBtn = document.getElementById("fireBtn");
  const jumpBtn = document.getElementById("jumpBtn");

  let joyId = null;
  let lastX = 0, lastY = 0;

  function getJoyCenter() {
    const r = joyBase.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  joyBase.addEventListener("touchstart", (e) => { joyId = e.touches[0].identifier; }, { passive: true });

  document.addEventListener("touchmove", (e) => {
    for (const t of e.touches) {
      if (t.identifier === joyId) {
        const c = getJoyCenter();
        let dx = t.clientX - c.x, dy = t.clientY - c.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 40) { dx = (dx / dist) * 40; dy = (dy / dist) * 40; }
        joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
        touchMoveX = dx / 50;
        touchMoveZ = dy / 50;
      }
      if (t.clientX > window.innerWidth / 2 && gameRunning) {
        player.yaw -= (t.clientX - lastX) * 0.005;
        player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - (t.clientY - lastY) * 0.005));
        lastX = t.clientX; lastY = t.clientY;
      }
    }
  }, { passive: true });

  document.addEventListener("touchend", (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) { joyId = null; touchMoveX = 0; touchMoveZ = 0; joyStick.style.transform = ""; }
    }
  });

  fireBtn.addEventListener("touchstart", () => { mouseDown = true; }, { passive: true });
  fireBtn.addEventListener("touchend", () => { mouseDown = false; });
  jumpBtn.addEventListener("touchstart", () => { keys.Space = true; }, { passive: true });
  jumpBtn.addEventListener("touchend", () => { keys.Space = false; });
}

function updatePlayer(dt) {
  const fw = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const rg = new THREE.Vector3(-fw.z, 0, fw.x);

  let mx = touchMoveX, mz = touchMoveZ;
  if (keys.KeyW) mz -= 1;
  if (keys.KeyS) mz += 1;
  if (keys.KeyA) mx -= 1;
  if (keys.KeyD) mx += 1;

  const wish = new THREE.Vector3();
  if (mx || mz) wish.addScaledVector(fw, -mz).addScaledVector(rg, mx).normalize().multiplyScalar(4.4);
  player.vel.x += (wish.x - player.vel.x) * 0.2;
  player.vel.z += (wish.z - player.vel.z) * 0.2;

  const next = player.pos.clone();
  next.x += player.vel.x * dt;
  next.z += player.vel.z * dt;

  for (const c of colliders) {
    const dx = next.x - c.cx, dz = next.z - c.cz;
    const hw = c.hx + 0.45, hd = c.hz + 0.45;
    if (Math.abs(dx) < hw && Math.abs(dz) < hd) {
      const ox = hw - Math.abs(dx), oz = hd - Math.abs(dz);
      if (ox < oz) next.x += Math.sign(dx || 1) * ox;
      else next.z += Math.sign(dz || 1) * oz;
    }
  }

  const lim = PLAY_R - 3;
  next.x = Math.max(-lim, Math.min(lim, next.x));
  next.z = Math.max(-lim, Math.min(lim, next.z));
  player.pos.copy(next);

  if (keys.Space && player.onGround) { player.vy = 5.4; player.onGround = false; }
  player.vy -= 15.5 * dt;
  player.pos.y += player.vy * dt;
  if (player.pos.y <= 0) { player.pos.y = 0; player.vy = 0; player.onGround = true; }

  if (performance.now() - player.lastDamage > 4200 && player.health < player.maxHealth) player.health = Math.min(player.maxHealth, player.health + 9 * dt);
  if (player.power < player.maxPower) player.power = Math.min(player.maxPower, player.power + 35 * dt);

  playerGroup.position.copy(player.pos);
  playerGroup.rotation.y = player.yaw;
  camera.position.set(player.pos.x - Math.sin(player.yaw) * 4, player.pos.y + 1.8, player.pos.z - Math.cos(player.yaw) * 4);
  camera.lookAt(player.pos.x, player.pos.y + 1.2, player.pos.z);
  sun.target.position.copy(player.pos);

  const speed = Math.hypot(player.vel.x, player.vel.z);
  if (speed > 0.3) {
    walkT += dt * (5 + speed);
    const swing = Math.sin(walkT) * Math.min(0.7, speed * 0.18);
    legL.rotation.x = swing;
    legR.rotation.x = -swing;
    armL.rotation.x = -swing * 0.8;
    if (!attackAnimT) armR.rotation.x = swing * 0.8;
  } else {
    walkT = 0;
    legL.rotation.x += (0 - legL.rotation.x) * 0.2;
    legR.rotation.x += (0 - legR.rotation.x) * 0.2;
    armL.rotation.x += (0 - armL.rotation.x) * 0.2;
    if (!attackAnimT) armR.rotation.x += (0 - armR.rotation.x) * 0.2;
  }

  if (attackAnimT > 0) {
    attackAnimT = Math.max(0, attackAnimT - dt * 4.5);
    const s = Math.sin(attackAnimT * Math.PI);
    armR.rotation.x = -0.6 - s * 0.9;
    sword.rotation.z = swordRestRot.z - s * 1.9;
    sword.rotation.x = s * 0.6;
  } else {
    sword.rotation.z += (swordRestRot.z - sword.rotation.z) * 0.3;
    sword.rotation.x += (0 - sword.rotation.x) * 0.3;
  }
}

function updateEnemies(dt) {
  for (const e of enemies) {
    const dx = player.pos.x - e.group.position.x, dz = player.pos.z - e.group.position.z;
    const dist = Math.hypot(dx, dz);
    e.group.rotation.y = Math.atan2(dx, dz);
    if (dist > e.attackRange && dist > 1) {
      const dir = new THREE.Vector3(dx, 0, dz).normalize();
      e.group.position.x += dir.x * e.speed * dt;
      e.group.position.z += dir.z * e.speed * dt;
    }
    e.bar.position.set(e.group.position.x, e.group.position.y + 2, e.group.position.z);
    if (dist <= e.attackRange && performance.now() - e.lastAttack > 1500) {
      e.lastAttack = performance.now();
      if (dist <= 2) { player.health -= e.damage; player.lastDamage = performance.now(); }
    }
  }
}

// ---------- HUD ----------
const heartsEl = document.getElementById("hearts");
const HEART_PATH = "M12 21s-6.7-4.35-9.3-8.28C1.1 10.7 1 8.9 2.1 7.2 3.4 5.2 6.4 4.7 8.3 6.3L12 9.4l3.7-3.1c1.9-1.6 4.9-1.1 6.2.9 1.1 1.7 1 3.5-.6 5.5C18.7 16.65 12 21 12 21z";
const TOTAL_HEARTS = 5;
const heartEls = [];
for (let i = 0; i < TOTAL_HEARTS; i++) {
  const d = document.createElement("div");
  d.className = "heart";
  d.innerHTML = `<svg class="bg" viewBox="0 0 24 24"><path d="${HEART_PATH}"/></svg><svg class="fg" viewBox="0 0 24 24"><path d="${HEART_PATH}"/></svg>`;
  heartsEl.appendChild(d);
  heartEls.push(d.querySelector(".fg"));
}
function updateHearts() {
  const frac = Math.max(0, player.health) / player.maxHealth * TOTAL_HEARTS;
  heartEls.forEach((fg, i) => {
    const f = Math.max(0, Math.min(1, frac - i));
    fg.style.clipPath = `inset(0 ${(1 - f) * 100}% 0 0)`;
  });
}

const staminaRing = document.getElementById("staminaRing");
const RING_LEN = 2 * Math.PI * 27;
function updateStamina() {
  const f = player.power / player.maxPower;
  staminaRing.style.strokeDasharray = RING_LEN;
  staminaRing.style.strokeDashoffset = RING_LEN * (1 - f);
}

const mmCanvas = document.getElementById("minimap");
const mmCtx = mmCanvas.getContext("2d");
function drawMinimap() {
  const w = mmCanvas.width, h = mmCanvas.height, cx = w / 2, cy = h / 2, R = w / 2 - 3;
  mmCtx.clearRect(0, 0, w, h);
  mmCtx.save();
  mmCtx.beginPath(); mmCtx.arc(cx, cy, R, 0, Math.PI * 2); mmCtx.clip();
  mmCtx.fillStyle = "#1c2b13"; mmCtx.fillRect(0, 0, w, h);
  const scale = R / (PLAY_R + 6);
  // shrine marker
  mmCtx.fillStyle = "#ffcc55";
  mmCtx.beginPath(); mmCtx.arc(cx + 0 * scale, cy - (-30 - player.pos.z + player.pos.z) * 0, 2, 0, 7); mmCtx.fill();
  const shrineX = cx + (0 - player.pos.x) * scale;
  const shrineY = cy + (-30 - player.pos.z) * scale;
  mmCtx.beginPath(); mmCtx.arc(shrineX, shrineY, 3, 0, Math.PI * 2); mmCtx.fill();
  // enemies
  mmCtx.fillStyle = "#ff5a5a";
  for (const e of enemies) {
    const ex = cx + (e.group.position.x - player.pos.x) * scale;
    const ey = cy + (e.group.position.z - player.pos.z) * scale;
    mmCtx.beginPath(); mmCtx.arc(ex, ey, 2.6, 0, Math.PI * 2); mmCtx.fill();
  }
  // player (triangle, rotates with yaw)
  mmCtx.translate(cx, cy);
  mmCtx.rotate(player.yaw);
  mmCtx.fillStyle = "#ffe066";
  mmCtx.beginPath();
  mmCtx.moveTo(0, -6); mmCtx.lineTo(4, 5); mmCtx.lineTo(-4, 5); mmCtx.closePath();
  mmCtx.fill();
  mmCtx.restore();
}

function updateUI() {
  updateHearts();
  updateStamina();
  drawMinimap();
  document.getElementById("score").textContent = score;
  document.getElementById("wave").textContent = waveNum;
  document.getElementById("kills").textContent = kills;
}

window.startGame = function() {
  document.getElementById("menu").classList.add("hidden");
  gameRunning = true;
  player.pos.set(0, 0, 22);
  player.health = 100;
  player.power = 100;
  score = 0; kills = 0; waveNum = 1;
  enemies.slice().forEach(e => killEnemy(e));
  for (let i = 0; i < 5; i++) {
    const e = spawnEnemy(i < 2 ? "shooter" : "grunt");
    const a = Math.random() * Math.PI * 2;
    e.group.position.set(Math.cos(a) * 40, 0, Math.sin(a) * 40);
  }
  if (!isTouch) canvas.requestPointerLock();
  updateUI();
};

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (gameRunning) {
    updatePlayer(dt);
    updateEnemies(dt);
    camera.updateMatrixWorld();

    if (mouseDown && player.power >= 20 && performance.now() - player.lastFire > 250) {
      player.lastFire = performance.now();
      player.power -= 20;
      attackAnimT = 1;
      const swordPos = new THREE.Vector3();
      sword.getWorldPosition(swordPos);
      for (const e of enemies) {
        if (swordPos.distanceTo(e.group.position) < 2.5 && e.alive) {
          e.hp -= 25 + Math.random() * 15;
          score += 15;
          if (e.hp <= 0) { killEnemy(e); kills++; score += 50; }
        }
      }
    }

    if (enemies.length === 0) {
      waveNum++;
      for (let i = 0; i < 4 + waveNum; i++) {
        const e = spawnEnemy(Math.random() < 0.4 ? "shooter" : "grunt");
        const a = Math.random() * Math.PI * 2;
        e.group.position.set(Math.cos(a) * 40, 0, Math.sin(a) * 40);
      }
    }

    if (player.health <= 0) {
      gameRunning = false;
      const menu = document.getElementById("menu");
      menu.classList.remove("hidden");
      menu.innerHTML = `<div class="card"><h1>쓰러졌습니다</h1><div class="sub">점수 ${score} · 웨이브 ${waveNum} · 킬 ${kills}</div><button class="startBtn" onclick="location.reload()">다시 도전</button></div>`;
    }

    updateUI();
  }

  renderer.render(scene, camera);
}
animate();
</script>
