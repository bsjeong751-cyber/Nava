<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>링크의 모험</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #87ceeb;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  canvas { display: block; }

  #ui {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .panel {
    position: absolute;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
  }

  #health { left: 10px; bottom: 10px; width: 200px; }
  #health .bar {
    width: 100%;
    height: 20px;
    background: #333;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 5px;
  }
  #health .bar-fill { height: 100%; background: #22c55e; transition: width 0.2s; }

  #stats { top: 10px; right: 10px; text-align: right; }

  #menu {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    z-index: 20;
  }
  #menu.hidden { display: none; }

  .card {
    text-align: center;
    background: rgba(0,0,0,0.9);
    padding: 40px;
    border-radius: 10px;
  }

  .card h1 { font-size: 32px; margin-bottom: 20px; }
  .card p { margin-bottom: 20px; color: #aaa; }
  .tips { text-align: left; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 12px; line-height: 1.6; }

  button {
    background: #ef4444;
    color: #fff;
    border: none;
    padding: 12px 30px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #dc2626; }

  #touchUI { display: none; }
  body.touch #touchUI { display: block; }

  #joyBase {
    position: fixed;
    left: 20px;
    bottom: 80px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.3);
    z-index: 5;
  }

  #joyStick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 50px;
    height: 50px;
    margin: -25px 0 0 -25px;
    border-radius: 50%;
    background: rgba(255,0,0,0.3);
    border: 2px solid rgba(255,0,0,0.6);
  }

  .btn {
    position: fixed;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(255,0,0,0.3);
    border: 2px solid rgba(255,0,0,0.6);
    color: #fff;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    cursor: pointer;
  }
  #fireBtn { right: 20px; bottom: 80px; }
  #jumpBtn { right: 20px; bottom: 170px; }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui">
    <div id="health" class="panel">
      <div>❤ <span id="hp">100</span>/100</div>
      <div class="bar"><div class="bar-fill" id="hpBar"></div></div>
    </div>
    <div id="stats" class="panel">
      <div>점수: <span id="score">0</span></div>
      <div>웨이브: <span id="wave">1</span></div>
      <div>킬: <span id="kills">0</span></div>
    </div>
  </div>

  <div id="menu">
    <div class="card">
      <h1>링크의 모험</h1>
      <p>젤다 스타일 액션 게임</p>
      <div class="tips">
        <b>PC:</b> WASD 이동 · 마우스 카메라 · 클릭 공격<br>
        <b>모바일:</b> 조이스틱 · 드래그 카메라 · 버튼 공격
      </div>
      <button onclick="startGame()">전투 시작</button>
    </div>
  </div>

  <div id="touchUI">
    <div id="joyBase"><div id="joyStick"></div></div>
    <div id="fireBtn" class="btn">⚔️</div>
    <div id="jumpBtn" class="btn">⤒</div>
  </div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from "three";

const canvas = document.getElementById("game");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x87ceeb);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
scene.add(camera);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 지면
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x2d5016, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const colliders = [];

function addBox(x, z, w, d, h, color) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.75 })
  );
  mesh.position.set(x, h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  colliders.push({ cx: x, cz: z, hx: w / 2, hz: d / 2 });
}

// 장애물
addBox(-10, -10, 4, 4, 2.5, 0xa0826d);
addBox(10, -10, 4, 4, 2.5, 0xb8956a);
addBox(0, 5, 4, 4, 2.5, 0x9d7e73);
addBox(-15, 10, 5, 3, 2.5, 0xa0826d);
addBox(15, 10, 5, 3, 2.5, 0xb8956a);

// 라이팅
scene.add(new THREE.HemisphereLight(0x87ceeb, 0x90ee90, 1.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xfff8dc, 2);
sun.position.set(20, 32, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
scene.add(sun);

// 플레이어
const playerGroup = new THREE.Group();
scene.add(playerGroup);

const torso = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.55, 0.25), new THREE.MeshStandardMaterial({ color: 0x2d5016 }));
torso.position.y = 0.8;
torso.castShadow = true;
playerGroup.add(torso);

const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.4, 0.35), new THREE.MeshStandardMaterial({ color: 0xf4a460 }));
head.position.y = 1.5;
head.castShadow = true;
playerGroup.add(head);

const hair = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.25, 0.38), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
hair.position.y = 1.7;
hair.castShadow = true;
playerGroup.add(hair);

const sword = new THREE.Group();
const blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.6, 0.02), new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.9 }));
blade.position.y = 0.3;
sword.add(blade);
sword.position.set(0.2, 0.8, -0.3);
playerGroup.add(sword);

const player = {
  pos: new THREE.Vector3(0, 0, 24),
  vel: new THREE.Vector3(),
  yaw: Math.PI,
  pitch: 0,
  vy: 0,
  onGround: true,
  health: 100,
  maxHealth: 100,
  lastFire: 0,
  lastDamage: -99,
};

const enemies = [];
let score = 0, kills = 0, waveNum = 1;
let gameRunning = false;

function makeHealthBar() {
  const group = new THREE.Group();
  const fg = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0x22c55e }));
  fg.scale.set(0.9, 0.09, 1);
  group.add(fg);
  group.userData.fg = fg;
  return group;
}

function spawnEnemy(type) {
  const color = type === "shooter" ? 0x1e40af : 0xdc2626;
  const group = new THREE.Group();

  const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.25), new THREE.MeshStandardMaterial({ color }));
  body.position.y = 0.8;
  body.castShadow = true;
  group.add(body);

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshStandardMaterial({ color }));
  head.position.y = 1.4;
  head.castShadow = true;
  group.add(head);

  scene.add(group);

  const bar = makeHealthBar();
  scene.add(bar);

  const enemy = {
    group, bar, type,
    hp: type === "shooter" ? 45 : 70,
    maxHp: type === "shooter" ? 45 : 70,
    speed: type === "shooter" ? 2.6 : 3.4,
    attackRange: type === "shooter" ? 13 : 1.7,
    lastAttack: -99,
    damage: type === "shooter" ? 8 : 14,
    alive: true,
  };
  enemies.push(enemy);
  return enemy;
}

function killEnemy(e) {
  e.alive = false;
  const idx = enemies.indexOf(e);
  if (idx >= 0) enemies.splice(idx, 1);
  scene.remove(e.group);
  scene.remove(e.bar);
}

const keys = {};
window.addEventListener("keydown", (e) => { keys[e.code] = true; });
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

let mouseDown = false;
canvas.addEventListener("mousedown", () => { mouseDown = true; });
canvas.addEventListener("mouseup", () => { mouseDown = false; });

document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== canvas) return;
  player.yaw -= e.movementX * 0.0022;
  player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - e.movementY * 0.0022));
});

// 터치 지원
const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
let touchMoveX = 0, touchMoveZ = 0;

if (isTouch) {
  document.body.classList.add("touch");
  const joyBase = document.getElementById("joyBase");
  const joyStick = document.getElementById("joyStick");
  const fireBtn = document.getElementById("fireBtn");
  const jumpBtn = document.getElementById("jumpBtn");

  let joyId = null;
  let lastX = 0, lastY = 0;

  function getJoyCenter() {
    const r = joyBase.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  joyBase.addEventListener("touchstart", (e) => { joyId = e.touches[0].identifier; }, { passive: true });

  document.addEventListener("touchmove", (e) => {
    for (const t of e.touches) {
      if (t.identifier === joyId) {
        const c = getJoyCenter();
        let dx = t.clientX - c.x, dy = t.clientY - c.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 40) { dx = (dx / dist) * 40; dy = (dy / dist) * 40; }
        joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
        touchMoveX = dx / 50;
        touchMoveZ = dy / 50;
      }
      if (t.clientX > window.innerWidth / 2 && gameRunning) {
        player.yaw -= (t.clientX - lastX) * 0.005;
        player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - (t.clientY - lastY) * 0.005));
        lastX = t.clientX;
        lastY = t.clientY;
      }
    }
  }, { passive: true });

  document.addEventListener("touchend", (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) { joyId = null; touchMoveX = 0; touchMoveZ = 0; joyStick.style.transform = ""; }
    }
  });

  fireBtn.addEventListener("touchstart", () => { mouseDown = true; }, { passive: true });
  fireBtn.addEventListener("touchend", () => { mouseDown = false; });
  jumpBtn.addEventListener("touchstart", () => { keys.Space = true; }, { passive: true });
  jumpBtn.addEventListener("touchend", () => { keys.Space = false; });
}

function updatePlayer(dt) {
  const fw = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const rg = new THREE.Vector3(-fw.z, 0, fw.x);

  let mx = touchMoveX, mz = touchMoveZ;
  if (keys.KeyW) mz -= 1;
  if (keys.KeyS) mz += 1;
  if (keys.KeyA) mx -= 1;
  if (keys.KeyD) mx += 1;

  const wish = new THREE.Vector3();
  if (mx || mz) wish.addScaledVector(fw, -mz).addScaledVector(rg, mx).normalize().multiplyScalar(4.4);
  player.vel.x += (wish.x - player.vel.x) * 0.2;
  player.vel.z += (wish.z - player.vel.z) * 0.2;

  const next = player.pos.clone();
  next.x += player.vel.x * dt;
  next.z += player.vel.z * dt;

  for (const c of colliders) {
    const dx = next.x - c.cx, dz = next.z - c.cz;
    const hw = c.hx + 0.45, hd = c.hz + 0.45;
    if (Math.abs(dx) < hw && Math.abs(dz) < hd) {
      const ox = hw - Math.abs(dx), oz = hd - Math.abs(dz);
      if (ox < oz) next.x += Math.sign(dx || 1) * ox;
      else next.z += Math.sign(dz || 1) * oz;
    }
  }

  const lim = 50 - 0.45;
  next.x = Math.max(-lim, Math.min(lim, next.x));
  next.z = Math.max(-lim, Math.min(lim, next.z));
  player.pos.copy(next);

  if (keys.Space && player.onGround) { player.vy = 5.4; player.onGround = false; }
  player.vy -= 15.5 * dt;
  player.pos.y += player.vy * dt;
  if (player.pos.y <= 0) { player.pos.y = 0; player.vy = 0; player.onGround = true; }

  if (performance.now() - player.lastDamage > 4200 && player.health < 100) player.health += 9 * dt;

  playerGroup.position.copy(player.pos);
  playerGroup.rotation.y = player.yaw;
  camera.position.set(player.pos.x - Math.sin(player.yaw) * 4, player.pos.y + 1.8, player.pos.z - Math.cos(player.yaw) * 4);
  camera.lookAt(player.pos.x, player.pos.y + 1.2, player.pos.z);
}

function updateEnemies(dt) {
  for (const e of enemies) {
    const dx = player.pos.x - e.group.position.x, dz = player.pos.z - e.group.position.z;
    const dist = Math.hypot(dx, dz);
    e.group.rotation.y = Math.atan2(dx, dz);
    if (dist > e.attackRange && dist > 1) {
      const dir = new THREE.Vector3(dx, 0, dz).normalize();
      e.group.position.x += dir.x * e.speed * dt;
      e.group.position.z += dir.z * e.speed * dt;
    }
    e.bar.position.set(e.group.position.x, e.group.position.y + 2, e.group.position.z);

    if (dist <= e.attackRange && performance.now() - e.lastAttack > 1500) {
      e.lastAttack = performance.now();
      if (dist <= 2) player.health -= e.damage;
    }
  }
}

function updateUI() {
  document.getElementById("hp").textContent = Math.ceil(player.health);
  document.getElementById("hpBar").style.width = (player.health / 100 * 100) + "%";
  document.getElementById("score").textContent = score;
  document.getElementById("wave").textContent = waveNum;
  document.getElementById("kills").textContent = kills;
}

window.startGame = function() {
  document.getElementById("menu").classList.add("hidden");
  gameRunning = true;
  player.pos.set(0, 0, 24);
  player.health = 100;
  score = 0;
  kills = 0;
  waveNum = 1;
  enemies.forEach(e => killEnemy(e));
  for (let i = 0; i < 5; i++) {
    const e = spawnEnemy(i < 2 ? "shooter" : "grunt");
    const a = Math.random() * Math.PI * 2;
    e.group.position.set(Math.cos(a) * 40, 0, Math.sin(a) * 40);
  }
  if (!isTouch) canvas.requestPointerLock();
  updateUI();
};

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (gameRunning) {
    updatePlayer(dt);
    updateEnemies(dt);

    if (mouseDown && performance.now() - player.lastFire > 250) {
      player.lastFire = performance.now();
      const swordPos = new THREE.Vector3();
      sword.getWorldPosition(swordPos);
      for (const e of enemies) {
        if (swordPos.distanceTo(e.group.position) < 2.5 && e.alive) {
          e.hp -= 25 + Math.random() * 15;
          score += 15;
          if (e.hp <= 0) { killEnemy(e); kills++; score += 50; }
        }
      }
    }

    if (enemies.length === 0) {
      waveNum++;
      for (let i = 0; i < 4 + waveNum; i++) {
        const e = spawnEnemy(Math.random() < 0.4 ? "shooter" : "grunt");
        const a = Math.random() * Math.PI * 2;
        e.group.position.set(Math.cos(a) * 40, 0, Math.sin(a) * 40);
      }
    }

    if (player.health <= 0) {
      gameRunning = false;
      document.getElementById("menu").classList.remove("hidden");
      document.getElementById("menu").innerHTML = `<div class="card"><h1>패배 💀</h1><p>점수: ${score} | 웨이브: ${waveNum} | 킬: ${kills}</p><button onclick="location.reload()">다시</button></div>`;
    }

    updateUI();
  }

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
